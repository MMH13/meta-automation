# meta-automation cloud poster (same pattern as social-automation post-memes)
name: Run Meta post queue (IG + comments)

on:
  schedule:
    # 03:23 UTC = 09:23 Dhaka — right after the daily 09:10 IG slot
    - cron: "23 3 * * *"
    # Twice an hour, at off-peak minutes. GitHub runs scheduled workflows on a
    # best-effort basis and drops or delays them hardest around the top of the
    # hour; the old ":07" cron was landing with measured 3-6h gaps, so items
    # posted in bursts instead of on their slots. Two odd-minute attempts give
    # the schedule more chances to actually fire, and meta_cli's per-account cap
    # keeps a catch-up from emptying the backlog in one go.
    - cron: "23 * * * *"
    - cron: "53 * * * *"
  workflow_dispatch:

concurrency:
  group: posting
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build accounts.json from secret
        run: printf '%s' "$ACCOUNTS_JSON" > accounts.json
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
      - name: Run queue
        run: python meta_cli.py run-queue
      - name: Commit queue state
        if: always()
        run: |
          rm -f accounts.json
          git config user.name "auto-poster"
          git config user.email "actions@github.com"
          git add queue.json comments.json
          git diff --cached --quiet || git commit -m "queue: mark posted"
          git pull --rebase origin main
          git push
